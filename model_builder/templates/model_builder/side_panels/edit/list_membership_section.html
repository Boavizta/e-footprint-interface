<div id="list-membership-section-{{ object_to_edit.efootprint_id }}">
{% with panel_id=object_to_edit.efootprint_id %}
{% for section in list_membership_sections %}
    <div class="list-membership-section border rounded-2 p-3 mb-3">
        <h6 class="mb-2"><b>{{ section.title }}</b></h6>
        {% for membership in section.memberships %}
            <div class="dict-membership-row"
                 data-list-membership-name="{{ membership.parent_name }}">
                <span class="dict-membership-name">{{ membership.parent_name }}</span>
                <button type="button"
                        class="unlink-btn btn"
                        title="Remove from {{ membership.parent_name }}"
                        {% if membership.unlink_disabled %}disabled{% endif %}
                        hx-post="/model_builder/unlink-list-entry/{{ membership.parent_id }}/{{ panel_id }}/"
                        hx-swap="none"
                        hx-vals='js:{...recomputationVals()}'>
                    &times;
                </button>
            </div>
        {% endfor %}
        {% if section.available_parents %}
            <div class="add-to-group-row d-flex align-items-center gap-2 mt-2">
                <select id="add-to-list-select-{{ panel_id }}-{{ section.section_id }}" name="parent_id"
                        class="form-select form-select-sm flex-grow-1">
                    {% for parent in section.available_parents %}
                        <option value="{{ parent.efootprint_id }}">{{ parent.name }}</option>
                    {% endfor %}
                </select>
                <button type="button"
                        class="btn btn-sm btn-primary"
                        hx-post="/model_builder/link-list-entry/{{ panel_id }}/"
                        hx-include="#add-to-list-select-{{ panel_id }}-{{ section.section_id }}"
                        hx-swap="none"
                        hx-vals='js:{...recomputationVals()}'>
                    {{ section.add_to_label }}
                </button>
            </div>
        {% endif %}
    </div>
{% endfor %}
{% endwith %}
</div>
