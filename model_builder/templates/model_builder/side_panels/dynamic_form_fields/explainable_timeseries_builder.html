<div id="{{ field.web_id }}__builder" data-timeseries-builder data-field-web-id="{{ field.web_id }}"
     data-field-name="{{ field.attr_name }}" data-preview-url="{% url 'timeseries-preview' %}"
     data-preview-id="{{ field.web_id }}__preview" class="weekly-timeseries-builder">
    {% if field.show_builder_selector %}
        <div class="weekly-builder-mode mb-2">
            <label class="form-label" for="{{ field.web_id }}__builder_selector">Definition</label>
            <select class="form-select form-select-sm" id="{{ field.web_id }}__builder_selector" data-builder-selector
                    aria-describedby="{{ field.web_id }}__weekly_error">
                {% for builder in field.builders %}
                    <option value="{{ builder.identifier }}"
                            {% if builder.identifier == field.selected_builder %}selected{% endif %}>{{ builder.label }}</option>
                {% endfor %}
            </select>
        </div>
    {% endif %}

    <div class="weekly-pattern-preview-shell" data-timeseries-preview-column>
        <aside class="weekly-pattern-preview" aria-live="polite" data-timeseries-preview
               data-preview-id="{{ field.web_id }}__preview" data-latest-request-sequence="0">
            <div class="d-flex align-items-start justify-content-between gap-3 mb-3">
                <div>
                    <p class="weekly-pattern-preview__eyebrow mb-1">Live preview</p>
                    <h3 class="weekly-pattern-preview__title mb-1">Generated week</h3>
                    <p class="small text-muted mb-0">{{ field.label }}</p>
                </div>
                <span class="weekly-pattern-preview__badge">168 hours</span>
            </div>
            <div class="weekly-pattern-preview__chart">
                <canvas aria-label="Preview of the generated 168-hour weekly timeseries" role="img"
                        data-timeseries-preview-canvas></canvas>
            </div>
            <p class="weekly-pattern-preview__status mb-0" data-timeseries-preview-status>
                Preparing preview…
            </p>
        </aside>
        <div class="d-none" id="{{ field.web_id }}__preview_responses"
             data-timeseries-preview-responses></div>
    </div>

    <div class="weekly-definition" data-timeseries-editor-column>
        {% for builder in field.builders %}
            <section data-builder-panel="{{ builder.identifier }}"
                     {% if builder.identifier != field.selected_builder %}hidden{% endif %}>
                {% include "model_builder/side_panels/dynamic_form_fields/"|add:builder.template_name %}
            </section>
        {% endfor %}
    </div>
</div>
