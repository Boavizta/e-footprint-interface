{% load l10n %}
<div class="mb-3" id="{{ field.web_id }}" data-timeseries-preview data-hourly-timeseries-preview
     data-field-web-id="{{ field.web_id }}" data-field-name="{{ field.attr_name }}"
     data-preview-url="{% url 'timeseries-preview' %}" data-preview-id="{{ field.web_id }}__preview"
     data-latest-request-sequence="0" data-timeseries-preview-canvas-id="timeSeriesChart"
     data-timeseries-preview-container-id="chartTimeseries" data-timeseries-preview-granularity-id="display_granularity">
    <div class="accordion accordion-panel" id="{{ field.web_id }}__usage_projection">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button fs-3xl" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#{{ field.web_id }}__usage_projection_panel"
                        aria-expanded="true"
                        aria-controls="{{ field.web_id }}__usage_projection_panel">
                    Build my usage volume projection
                </button>
            </h2>
            <div id="{{ field.web_id }}__usage_projection_panel"
                 class="accordion-collapse collapse show"
                 data-bs-parent="#{{ field.web_id }}__usage_projection">
                <div class="accordion-body">
                    <!-- Start Date -->
                    <div class="mb-3">
                        <label for="{{ field.web_id }}__start_date" class="form-label">Start date</label>
                        <input type="text" class="form-control p-2"
                               name="{{ field.web_id }}__start_date"
                               id="{{ field.web_id }}__start_date"
                               value="{{ field.default.start_date }}"
                               data-default-value="{{ field.default.start_date }}"
                               data-hourly-preview-input
                               required
                        >
                    </div>

                    <!-- Modeling Duration -->
                    <div class="mb-3">
                        <label for="{{ field.web_id }}__modeling_duration_value" class="form-label w-100">Modeling duration</label>
                        <div class="input-group">
                            <input type="number" class="form-control input_with_add_on"
                                   name="{{ field.web_id }}__modeling_duration_value"
                                   id="{{ field.web_id }}__modeling_duration_value"
                                   value="{{ field.default.modeling_duration_value|unlocalize }}"
                                   max="{% if field.default.modeling_duration_unit == 'year' %}10{% else %}120{% endif %}"
                                   aria-describedby="basic-addon3 basic-addon4"
                                   required
                                   data-default-value="{{ field.default.modeling_duration_value|unlocalize }}"
                                   data-associated-unit-id="{{ field.web_id }}__modeling_duration_unit"
                                   data-hourly-preview-input
                            >
                            <select class="input-group-text"
                                    name="{{ field.web_id }}__modeling_duration_unit"
                                    id="{{ field.web_id }}__modeling_duration_unit"
                                    data-hourly-preview-input
                                    data-default-value="{{ field.default.modeling_duration_unit }}"
                            >
                                <option value="month" {% if field.default.modeling_duration_unit == "month" %}selected{% endif %}>Months</option>
                                <option value="year" {% if field.default.modeling_duration_unit == "year" %}selected{% endif %}>Years</option>
                            </select>
                        </div>
                        <div class="d-none text-danger fs-xl" id="modeling_duration_value_error_message"
                             data-modeling-duration-error></div>
                    </div>

                    <!-- Initial Volume -->
                    <div class="mb-3">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <label for="{{ field.web_id }}__initial_volume" class="form-label mb-0">
                                {{ field.subfields_ui_config.initial_volume.label|default:"Initial volume" }}
                            </label>
                            {% if field.subfields_ui_config.initial_volume.tooltip %}
                                {% include "model_builder/side_panels/components/tooltip.html" with tooltip=field.subfields_ui_config.initial_volume.tooltip tooltip_wrapper_class="d-inline-flex align-items-center" %}
                            {% endif %}
                        </div>
                        <div class="input-group">
                            <input type="number" class="form-control input_with_add_on"
                                   name="{{ field.web_id }}__initial_volume"
                                   id="{{ field.web_id }}__initial_volume"
                                   min="0"
                                   value="{{ field.default.initial_volume|unlocalize }}"
                                   placeholder="Input a number"
                                   aria-describedby="basic-addon3 basic-addon4"
                                   required
                                   data-default-value="{{ field.default.initial_volume|unlocalize }}"
                                   data-associated-unit-id="{{ field.web_id }}__initial_volume_timespan"
                                   data-hourly-preview-input
                            >
                            <select class="input-group-text"
                                    name="{{ field.web_id }}__initial_volume_timespan"
                                    id="{{ field.web_id }}__initial_volume_timespan"
                                    data-default-value="{{ field.default.initial_volume_timespan }}"
                                    data-hourly-preview-input
                            >
                                <option value="day" {% if field.default.initial_volume_timespan == "day" %}selected{% endif %}>Daily</option>
                                <option value="month" {% if field.default.initial_volume_timespan == "month" %}selected{% endif %}>Monthly</option>
                                <option value="year" {% if field.default.initial_volume_timespan == "year" %}selected{% endif %}>Yearly</option>
                            </select>
                        </div>
                    </div>

                    <!-- Net Growth Rate -->
                    <div class="mb-3">
                        <label for="{{ field.web_id }}__net_growth_rate_in_percentage" class="form-label w-100">Net growth rate (%)</label>
                        <div class="input-group">
                            <input type="number"
                                   class="form-control input_with_add_on"
                                   name="{{ field.web_id }}__net_growth_rate_in_percentage"
                                   id="{{ field.web_id }}__net_growth_rate_in_percentage"
                                   min="0"
                                   value="{{ field.default.net_growth_rate_in_percentage|unlocalize }}"
                                   aria-describedby="basic-addon3 basic-addon4"
                                   required
                                   data-default-value="{{ field.default.net_growth_rate_in_percentage|unlocalize }}"
                                   data-associated-unit-id="{{ field.web_id }}__net_growth_rate_timespan"
                                   data-hourly-preview-input
                            >
                            <select class="input-group-text"
                                    name="{{ field.web_id }}__net_growth_rate_timespan"
                                    id="{{ field.web_id }}__net_growth_rate_timespan"
                                    data-default-value="{{ field.default.net_growth_rate_timespan }}"
                                    data-hourly-preview-input
                            >
                                <option value="month" {% if field.default.net_growth_rate_timespan == "month" %}selected{% endif %}>Monthly</option>
                                <option value="year" {% if field.default.net_growth_rate_timespan == "year" %}selected{% endif %}>Yearly</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="d-none" data-timeseries-preview-responses></div>
</div>

<script>
    flatpickr('#{{ field.web_id }}__start_date', {
        enableTime: false,
        dateFormat: "Y-m-d"
    });
    (function attachAccordionSaveGuard() {
        function ensureAccordionOpenBeforeSave() {
            const accordionPanel = document.getElementById('{{ field.web_id }}__usage_projection_panel');
            if (!accordionPanel || accordionPanel.classList.contains('show')) {
                return;
            }
            const collapse = bootstrap.Collapse.getOrCreateInstance(accordionPanel, {toggle: false});
            collapse.show();
        }

        function registerListener() {
            const saveButton = document.getElementById('btn-submit-form');
            if (!saveButton) {
                return false;
            }
            saveButton.addEventListener('click', ensureAccordionOpenBeforeSave, true);
            return true;
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', registerListener, {once: true});
        } else if (!registerListener()) {
            requestAnimationFrame(registerListener);
        }
    }());
</script>
