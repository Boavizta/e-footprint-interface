<div class="weekly-pattern-editor"
     data-weekly-pattern-editor
     data-field-web-id="{{ field.web_id }}"
     data-can-be-negative="{% if field.can_be_negative %}true{% else %}false{% endif %}">
    <input type="hidden" name="{{ field.web_id }}__weekly_pattern" data-weekly-pattern-payload>

    <div class="weekly-pattern-summary mb-2">
        <div>
            <p class="weekly-pattern-summary__title mb-0">Weekly schedule</p>
            <p class="weekly-pattern-summary__hint mb-0">Repeats every week</p>
        </div>
        <span class="weekly-pattern-unit" data-weekly-unit>{{ builder.default.unit }}</span>
    </div>
    <div class="alert alert-danger py-2 d-none" id="{{ field.web_id }}__weekly_error"
         role="alert" aria-live="polite" data-weekly-error></div>

    <div data-weekly-profiles>
        {% for profile in builder.default.profiles %}
            <fieldset class="weekly-profile-card" data-weekly-profile>
                <legend class="weekly-profile-card__legend float-none w-auto" data-profile-legend>Profile {{ forloop.counter }}</legend>
                <button class="btn btn-sm btn-link text-danger weekly-profile-card__remove" type="button"
                        data-action="remove-weekly-profile"
                        aria-label="Remove profile {{ forloop.counter }}"
                        {% if builder.default.profiles|length == 1 %}disabled{% endif %}>Remove</button>
                <div class="weekly-profile-field">
                    <label class="form-label" for="{{ field.web_id }}__profile_{{ forloop.counter0 }}_name"
                           data-profile-name-label>Name</label>
                    <input class="form-control form-control-sm" type="text"
                           id="{{ field.web_id }}__profile_{{ forloop.counter0 }}_name"
                           value="{{ profile.name }}" required data-profile-name
                           aria-describedby="{{ field.web_id }}__profile_{{ forloop.counter0 }}_name_error">
                    <div class="invalid-feedback" id="{{ field.web_id }}__profile_{{ forloop.counter0 }}_name_error"
                         data-profile-name-error></div>
                </div>

                <div class="weekly-profile-field">
                    <span class="form-label d-block" id="{{ field.web_id }}__profile_{{ forloop.counter0 }}_days_label"
                          data-profile-days-label>Days</span>
                    <div class="weekly-day-picker" role="group"
                         aria-labelledby="{{ field.web_id }}__profile_{{ forloop.counter0 }}_days_label"
                         aria-describedby="{{ field.web_id }}__profile_{{ forloop.counter0 }}_days_error"
                         data-profile-days-group>
                        <label class="weekly-day-option" for="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_0" data-profile-day-label>
                            <input id="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_0"
                                   type="checkbox" value="0" data-profile-day
                                   {% if 0 in profile.days %}checked{% endif %}><span>Mon</span>
                        </label>
                        <label class="weekly-day-option" for="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_1" data-profile-day-label>
                            <input id="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_1"
                                   type="checkbox" value="1" data-profile-day
                                   {% if 1 in profile.days %}checked{% endif %}><span>Tue</span>
                        </label>
                        <label class="weekly-day-option" for="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_2" data-profile-day-label>
                            <input id="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_2"
                                   type="checkbox" value="2" data-profile-day
                                   {% if 2 in profile.days %}checked{% endif %}><span>Wed</span>
                        </label>
                        <label class="weekly-day-option" for="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_3" data-profile-day-label>
                            <input id="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_3"
                                   type="checkbox" value="3" data-profile-day
                                   {% if 3 in profile.days %}checked{% endif %}><span>Thu</span>
                        </label>
                        <label class="weekly-day-option" for="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_4" data-profile-day-label>
                            <input id="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_4"
                                   type="checkbox" value="4" data-profile-day
                                   {% if 4 in profile.days %}checked{% endif %}><span>Fri</span>
                        </label>
                        <label class="weekly-day-option" for="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_5" data-profile-day-label>
                            <input id="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_5"
                                   type="checkbox" value="5" data-profile-day
                                   {% if 5 in profile.days %}checked{% endif %}><span>Sat</span>
                        </label>
                        <label class="weekly-day-option" for="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_6" data-profile-day-label>
                            <input id="{{ field.web_id }}__profile_{{ forloop.counter0 }}_day_6"
                                   type="checkbox" value="6" data-profile-day
                                   {% if 6 in profile.days %}checked{% endif %}><span>Sun</span>
                        </label>
                    </div>
                    <div class="text-danger small d-none" id="{{ field.web_id }}__profile_{{ forloop.counter0 }}_days_error"
                         role="alert" data-profile-days-error></div>
                </div>

                <div class="weekly-profile-field">
                    <label class="form-label" for="{{ field.web_id }}__profile_{{ forloop.counter0 }}_baseline"
                           data-profile-baseline-label>Baseline</label>
                    <div class="input-group input-group-sm">
                        <input class="form-control" type="number"
                               id="{{ field.web_id }}__profile_{{ forloop.counter0 }}_baseline"
                               value="{{ profile.baseline }}" step="0.1" required data-profile-baseline
                               aria-describedby="{{ field.web_id }}__profile_{{ forloop.counter0 }}_baseline_error"
                               {% if not field.can_be_negative %}min="0"{% endif %}>
                        <span class="input-group-text" data-weekly-unit>{{ builder.default.unit }}</span>
                        <div class="invalid-feedback" id="{{ field.web_id }}__profile_{{ forloop.counter0 }}_baseline_error"
                             data-profile-baseline-error></div>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-sm align-middle weekly-ranges-table">
                        <thead><tr><th scope="col">From</th><th scope="col">To</th><th scope="col">Value</th>
                            <th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
                        <tbody data-profile-ranges>
                            {% for range in profile.ranges %}
                                <tr data-weekly-range>
                                    <td><input class="form-control form-control-sm" type="number" min="0" max="23" step="1"
                                               value="{{ range.start }}" required data-range-start
                                               aria-label="Range start hour"
                                               aria-describedby="{{ field.web_id }}__profile_{{ forloop.parentloop.counter0 }}_range_{{ forloop.counter0 }}_error">
                                        <div class="text-danger small d-none"
                                             id="{{ field.web_id }}__profile_{{ forloop.parentloop.counter0 }}_range_{{ forloop.counter0 }}_error"
                                             role="alert" data-range-error></div></td>
                                    <td><input class="form-control form-control-sm" type="number" min="1" max="24" step="1"
                                               value="{{ range.end }}" required data-range-end aria-label="Range end hour"
                                               aria-describedby="{{ field.web_id }}__profile_{{ forloop.parentloop.counter0 }}_range_{{ forloop.counter0 }}_error"></td>
                                    <td><input class="form-control form-control-sm" type="number" step="0.1"
                                               value="{{ range.value }}" required data-range-value
                                               aria-label="Range value"
                                               aria-describedby="{{ field.web_id }}__profile_{{ forloop.parentloop.counter0 }}_range_{{ forloop.counter0 }}_error"
                                               {% if not field.can_be_negative %}min="0"{% endif %}></td>
                                    <td><button class="btn btn-sm btn-link text-danger p-1" type="button"
                                                data-action="remove-weekly-range"
                                                aria-label="Remove range from profile {{ forloop.parentloop.counter }}">Remove</button></td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>

                <div>
                    <button class="btn btn-sm btn-outline-primary weekly-add-range" type="button"
                            data-action="add-weekly-range">+ Add time range</button>
                </div>
            </fieldset>
        {% endfor %}
    </div>

    <button class="btn weekly-add-profile w-100" type="button" data-action="add-weekly-profile"
            {% if builder.default.profiles|length >= 7 %}disabled{% endif %}>+ Add another profile</button>
</div>
