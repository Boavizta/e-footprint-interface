<div data-optional-quantity data-empty-controller-id="{{ field.empty_controller_id|default:'' }}"
     data-empty-controller-value="{{ field.empty_controller_value|default:'' }}"
     data-empty-only-for="{{ field.empty_only_for|join:',' }}">
    <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" id="{{ field.web_id }}__empty"
               data-action="optional-quantity-empty" {% if not field.default %}checked{% endif %}>
        <label class="form-check-label" for="{{ field.web_id }}__empty">Leave unset</label>
    </div>
    <div data-optional-quantity-value{% if not field.default %} class="d-none"{% endif %}>
        {% include 'model_builder/side_panels/dynamic_form_fields/explainable_quantity.html' with optional_quantity=True %}
    </div>
</div>
