{% if field.auto_sizing %}<div data-optional-quantity data-auto-controller-id="{{ field.auto_controller_id|default:'' }}"
     data-auto-controller-value="{{ field.auto_controller_value|default:'' }}"
     data-auto-only-for="{{ field.auto_only_for|join:',' }}">
    <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" id="{{ field.web_id }}__auto"
               data-action="optional-quantity-auto" {% if not field.default %}checked{% endif %}>
        <label class="form-check-label" for="{{ field.web_id }}__auto">Size instances automatically</label>
    </div>
    <p class="form-text mb-2" data-optional-quantity-help>Uses modeled demand. Turn off to set a fixed number of instances.</p>
{% endif %}
<div class="input-group{% if field.auto_sizing and not field.default %} d-none{% endif %}"{% if field.auto_sizing %} data-optional-quantity-value{% endif %}>
    <input type="number"
           class="form-control input_with_add_on
           {% if field.unit != "dimensionless" and not field.hide_unit %} rounded-start-2 w-75{% else %} rounded-2 w-100 {% endif %}"
           id="{{ field.web_id }}"
           name="{{ field.web_id }}"
           value="{{ field.default }}"
           step="{{ field.step }}"
           placeholder="{{ field.placeholder|default:'Enter value' }}"
           {% if not field.allows_empty or field.auto_sizing and field.default %}required{% endif %}
        {% if field.metadata.source %}
           data-default-value="{{ field.default }}"
           oninput="onInputValueChange(this.id);tagFormAsModified();"
        {% endif %}
        {% if not field.can_be_negative %}
           min="0"
        {% endif %}
    >
    <input
        class="border border-body-tertiary rounded-end-2 bg-light w-25 text-center text-body-tertiary"
        name="{{ field.web_id }}__unit"
        id="{{ field.web_id }}__unit"
        value="{{ field.unit }}"
        readonly
        {% if field.unit == "dimensionless" or field.hide_unit %}
            hidden
        {% endif %}
    >
</div>
{% if field.auto_sizing %}</div>{% endif %}
