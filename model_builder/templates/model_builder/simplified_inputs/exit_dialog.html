<dialog id="simplified-exit-dialog" aria-labelledby="simplified-exit-title">
    <h2 id="simplified-exit-title" class="h5">Unsaved simplified inputs</h2>
    <p>Save your configuration before continuing?</p>
    <div class="d-flex gap-2">
        <button type="button" class="btn btn-primary" data-action="simplified-exit-save">Save</button>
        <button type="button" class="btn btn-outline-secondary" data-action="simplified-exit-discard">Discard</button>
        <button type="button" class="btn btn-outline-secondary" data-action="simplified-exit-stay">Stay</button>
    </div>
</dialog>
