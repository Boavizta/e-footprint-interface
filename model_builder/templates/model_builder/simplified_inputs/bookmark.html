<details class="simplified-bookmark" id="{{ field.dom_id }}" name="simplified-bookmarks-{% if field.lazy %}sources{% else %}panel{% endif %}" data-bookmark
         data-owner-id="{{ field.address.object_id }}" data-attribute="{{ field.address.attribute|default:field.attribute }}"
         {% if field.provisional_owner %}data-provisional-owner="{{ field.provisional_owner }}" data-input-id="{{ field.input_id }}"{% else %}
         hx-post="{% url 'patch-simplified-inputs' %}" hx-trigger="bookmark-save" hx-target="#modal-container" hx-swap="none" hx-params="none"
         hx-indicator="find [data-bookmark-status]" hx-disinherit="hx-indicator" hx-on::before-request="this.querySelector('[data-bookmark-status]')?.replaceChildren()"{% endif %}>
    {% include 'model_builder/simplified_inputs/bookmark_summary.html' %}
    <div class="simplified-bookmark-content" data-bookmark-content>
        {% if field.lazy %}
            <div id="{{ field.dom_id }}-controls" hx-get="{% url 'simplified-input-bookmark' field.address.object_id field.address.attribute %}"
                 hx-trigger="bookmark-open once" hx-target="this" hx-swap="innerHTML"></div>
        {% else %}
            <div id="{{ field.dom_id }}-controls">{% include 'model_builder/simplified_inputs/bookmark_controls.html' %}</div>
        {% endif %}
    </div>
</details>
