{% extends "model_builder/side_panels/side_panel_structure.html" %}
{% block panel_body %}
<form id="sidePanelForm" data-simplified-timeseries autocomplete="off"
      hx-post="{% url 'edit-simplified-input' address.object_id address.attribute %}" hx-swap="none" hx-disabled-elt="button:not(:disabled)"
      hx-vals='js:{...recomputationVals()}' hx-indicator="#{{ status_id }}, [data-quick-total-status]"
      hx-on::before-request="document.getElementById('{{ status_id }}').replaceChildren()"
      hx-on::after-request="if (event.detail.elt === this) closeAndEmptySidePanel()">
    {% csrf_token %}
    <input type="hidden" name="timeseries" value="true">
    {% include "model_builder/side_panels/dynamic_form_fields/dynamic_form_field.html" %}
</form>
{% endblock %}
{% block save_button %}
<div class="d-flex gap-2 mb-3">
    <button id="btn-submit-form" class="btn btn-primary flex-grow-1" type="submit" form="sidePanelForm">Save</button>
    <button type="button" class="btn btn-outline-secondary" onclick="closeAndEmptySidePanel()">Cancel</button>
</div>
{% endblock %}
